[workspace]
resolver = "2"
members = ["crates/cell-core", "crates/cell-launcher", "crates/cell", "crates/cell-hub-api", "crates/cell-hub", "crates/cell-identity", "apps/launcher/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
blake3 = "1"
fuser = { version = "0.15", default-features = false }
zstd = "0.13"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
