name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The launcher must stay fully static.
      - run: cargo build --release -p cell-launcher --target x86_64-unknown-linux-musl
      - name: Launcher is static
        run: |
          file target/x86_64-unknown-linux-musl/release/cell-launcher | grep -q 'static'
          ! ldd target/x86_64-unknown-linux-musl/release/cell-launcher 2>/dev/null | grep -q '=>'

  # The Windows launcher cross-compiles from Linux with mingw-w64. It links
  # nothing from WinFsp at build time (the DLL is loaded at run time), so
  # this job needs no Windows host.
  windows:
    name: Windows launcher (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - run: cargo clippy -p cell-launcher --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --release -p cell-launcher --target x86_64-pc-windows-gnu
      - run: file target/x86_64-pc-windows-gnu/release/cell-launcher.exe | grep -q 'PE32+'

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated: a release only happens when HEAD carries a publish trailer.
  #   pre-release: true   → X.Y.Z-alpha, marked as a GitHub pre-release
  #   release: true       → X.Y.Z stable
  # Neither → CI runs tests only. The version is bumped from the last v* tag,
  # scanning conventional-commit subjects since that tag for the bump level
  # (0.x semantics: a breaking change bumps the minor, not the major).
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')

          if [[ "$IS_RELEASE" != "true" && "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No release/pre-release trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=0; PREV_PATCH=0; RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)
          [[ "$BUMP" == "none" ]] && BUMP="patch"

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE=false
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            VERSION="${VERSION}-alpha"
            PRERELEASE=true
          fi

          echo "Calculated version: $VERSION (bump=$BUMP, prerelease=$PRERELEASE, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── Build ─────────────────────────────────────────────────────────────────
  # The static launcher, the static build tool, and the build tool packaged
  # as a cell. Packaging a cell needs what a user's machine needs: user
  # namespaces, /dev/fuse and mksquashfs.
  build:
    name: Build release artifacts
    needs: [version, check]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-release
      - name: Host setup for cell builds
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools uidmap gcc-mingw-w64-x86-64
          sudo modprobe fuse || true
          # Ubuntu 24.04 strips capabilities from unprivileged user namespaces
          # unless this is off. Cells and cell builds need them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          ls -l /dev/fuse
          grep "^$(id -un):" /etc/subuid || echo "no subuid entry; the build falls back to one mapped id"
      - name: Stamp version
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i '0,/^version = ".*"$/s//version = "'"$V"'"/' Cargo.toml
          sed -i 's/^  version = ".*"$/  version = "'"$V"'"/' examples/cell-builder/cell.wcl
          grep -n '^version' Cargo.toml | head -1
          grep -n 'version' examples/cell-builder/cell.wcl | head -1
      - run: just all-build
      - run: cargo build --release -p cell --target x86_64-unknown-linux-musl
      - name: Windows launcher
        run: |
          just launcher-build-windows
          file target/x86_64-pc-windows-gnu/release/cell-launcher.exe | grep -q 'PE32+'
      - name: Package the build tool as a cell
        run: just example-build cell-builder
      - name: Smoke test the builder cell
        run: |
          ./examples/dist/cell-builder.cell validate examples/gl-tools/cell.wcl
          CELL_CMD=verify ./examples/dist/cell-builder.cell
          CELL_CMD=info ./examples/dist/cell-builder.cell | head -5
      - name: Stage assets
        run: |
          V="${{ needs.version.outputs.version }}"
          mkdir -p dist
          cp examples/dist/cell-builder.cell "dist/cell-builder-$V.cell"
          cp target/x86_64-unknown-linux-musl/release/cell-launcher "dist/cell-launcher-$V-linux-x86_64"
          cp target/x86_64-unknown-linux-musl/release/cell "dist/cell-$V-linux-x86_64"
          cp target/x86_64-pc-windows-gnu/release/cell-launcher.exe "dist/cell-launcher-$V-windows-x86_64.exe"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: bin-linux-x86_64
          path: dist/*
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit and cut a GitHub (pre-)release with the artifacts attached.
  release:
    name: Create GitHub release
    needs: [version, build]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
      - name: Tag
        run: |
          V="${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/**/*
