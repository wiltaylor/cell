[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
CC_x86_64_unknown_linux_musl = { value = "tools/musl-cc", relative = true }
AR_x86_64_unknown_linux_musl = "ar"
CC_aarch64_unknown_linux_musl = { value = "tools/musl-cc-aarch64", relative = true }
