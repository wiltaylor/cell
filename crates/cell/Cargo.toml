[package]
name = "cell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build tool: turns a cell.wcl file into a .cell portable application."

[[bin]]
name = "cell"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
ciborium.workspace = true
blake3.workspace = true
cell-core = { path = "../cell-core" }
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", rev = "1d056a5779a05ef278ec8edc71282ce20d8068dc" }
tar = "0.4"
zstd.workspace = true
flate2.workspace = true
# The native OCI registry client (`oci://` bases).
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
sha2 = "0.10"
