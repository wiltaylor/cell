[package]
name = "cell-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared pieces of the Cell portable application format: file layout, manifest, squashfs reader, FUSE server and sandbox."

[dependencies]
anyhow.workspace = true
serde.workspace = true
ciborium.workspace = true
blake3.workspace = true
zstd.workspace = true
flate2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
fuser.workspace = true
# NVIDIA `:fetch`: a pure-Rust HTTPS client, xz decoder and tar reader, so
# the static musl launcher can download and unpack the driver archive.
ureq = { version = "3", default-features = false, features = ["rustls"] }
lzma-rs = "0.3"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
# The WinFsp binding and the union file system call Win32 directly.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
] }
