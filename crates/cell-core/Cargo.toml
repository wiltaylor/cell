[package]
name = "cell-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared pieces of the Cell portable application format: file layout, manifest, squashfs reader, FUSE server and sandbox."

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
ciborium.workspace = true
blake3.workspace = true
fuser.workspace = true
zstd.workspace = true
flate2.workspace = true
# NVIDIA `:fetch`: a pure-Rust HTTPS client, xz decoder and tar reader, so
# the static musl launcher can download and unpack the driver archive.
ureq = { version = "3", default-features = false, features = ["rustls"] }
lzma-rs = "0.3"
tar = "0.4"
